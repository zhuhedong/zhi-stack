          content: `### 核心要点总结

Rust 没有采用 Go 的主动运行时抢占式协程，而是采用了零开销的惰性轮询协议：

\`\`\`rust
pub trait Future {
    type Output;
    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;
}
\`\`\`

#### 自引用结构体与 Pin
当异步函数遇到 \`.await\` 挂起点，编译器会将栈帧变量捕获进一个自动生成的 Enum 状态机中。由于状态机内部存在自指针引用，一旦发生内存位移，指针将瞬间失效。\`Pin\` 从类型系统层面消除了这种隐患。

> **微信公众号离线注记**：本文已本地转存 6 张原图，防 404 及微信图片防盗链封锁。`

**楼主提问**：单表数据量达 3000 万，频繁查询 \`WHERE tenant_id = ? AND status = ?\` 并返回 \`created_at, order_sn\`，回表开销占总时延 70%，求优化思路。

**社区高赞方案**：
推荐采用 PG 11+ 原生引入的 \`INCLUDE\` 附加列特性构建 Covering Index：

\`\`\`sql
CREATE INDEX idx_orders_covering ON orders (tenant_id, status) 
INCLUDE (created_at, order_sn);
\`\`\`

- **原理解析**：仅将前导列放入 B-Tree 索引判定层，\`INCLUDE\` 列存储在叶子节点的数据页中。查询命中索引时直接从叶子页拿数据，实现 **Index Only Scan**，执行耗时由 140ms 直降至 4ms。`

            return item.title.toLowerCase().includes(q) || item.sourceName.toLowerCase().includes(q) || (item.tags && item.tags.some(t => t.toLowerCase().includes(q)));

                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>

            <div class="flex gap-2 border-b border-black/10 pb-1 text-xs">
              <button onclick="setEpTab('headers')" class="px-2.5 py-1 rounded font-medium transition ${epTab === 'headers' ? 'bg-black/[0.05] shadow-sm border border-black/10 text-[#1d1d1f] border border-black/10' : 'text-black/60 hover:text-[#1d1d1f]'}">
                Headers 请求头 (${allHeaders.filter(h => h.enabled).length})

              <button onclick="setEpTab('params')" class="px-2.5 py-1 rounded font-medium transition ${epTab === 'params' ? 'bg-black/[0.05] shadow-sm border border-black/10 text-[#1d1d1f] border border-black/10' : 'text-black/60 hover:text-[#1d1d1f]'}">

              <button onclick="setEpTab('body')" class="px-2.5 py-1 rounded font-medium transition ${epTab === 'body' ? 'bg-black/[0.05] shadow-sm border border-black/10 text-[#1d1d1f] border border-black/10' : 'text-black/60 hover:text-[#1d1d1f]'}">

${compiledCurl}

    // 动态生成完整 cURL
    function compileLiveCurl(item, ep, allHeaders) {
      let finalPath = ep.path;
      (ep.pathParams || []).forEach(p => {
        finalPath = finalPath.replace(`{${p.key}}`, p.value);
      });

      const enabledQueries = (ep.queryParams || []).filter(q => q.enabled);
      let queryString = "";
      if (enabledQueries.length > 0) {
        queryString = "?" + enabledQueries.map(q => `${encodeURIComponent(q.key)}=${encodeURIComponent(q.value)}`).join('&');
      }

      const fullUrl = `${item.fields.baseUrl}${finalPath}${queryString}`;
      const headerLines = allHeaders
        .filter(h => h.enabled)
        .map(h => `  -H "${h.key}: ${h.value}"`)
        .join(' \\\n');

      let bodyLine = "";
      if (ep.method !== 'GET' && ep.requestBody && ep.requestBody.trim()) {
        try {
          const compactJson = JSON.stringify(JSON.parse(ep.requestBody || '{}'));
          bodyLine = ` \\\n  -d '${compactJson}'`;
        } catch(e) {
          bodyLine = ` \\\n  -d '${ep.requestBody.replace(/\n/g, ' ')}'`;
        }
      }

      return `curl -X ${ep.method} "${fullUrl}" \\\n${headerLines}${bodyLine}`;
    }

    function selectEndpoint(idx) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      if (item) {
        item.selectedEndpointIndex = idx;
        probeResponseMock = null;
        renderCredentialCanvas(item);
      }
    }

    function setEpTab(tab) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      if (item) {
        item.endpointTab = tab;
        renderCredentialCanvas(item);
      }
    }

    function toggleHeaderEnabled(idx, isGlobal) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      if (!item) return;
      if (isGlobal) {
        item.globalHeaders[idx].enabled = !item.globalHeaders[idx].enabled;
      } else {
        const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
        const customIdx = idx - item.globalHeaders.length;
        ep.customHeaders[customIdx].enabled = !ep.customHeaders[customIdx].enabled;
      }
      renderCredentialCanvas(item);
    }

    function toggleQueryEnabled(qIdx) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      ep.queryParams[qIdx].enabled = !ep.queryParams[qIdx].enabled;
      renderCredentialCanvas(item);
    }

    function updateHeaderValue(idx, isGlobal, val) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      if (!item) return;
      if (isGlobal) {
        item.globalHeaders[idx].value = val;
      } else {
        const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
        const customIdx = idx - item.globalHeaders.length;
        ep.customHeaders[customIdx].value = val;
      }
      refreshLiveCurlBox(item);
    }

    function updatePathParam(pIdx, val) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      ep.pathParams[pIdx].value = val;
      refreshLiveCurlBox(item);
    }

    function updateQueryParam(qIdx, val) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      ep.queryParams[qIdx].value = val;
      refreshLiveCurlBox(item);
    }

    function updateBodyContent(val) {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      ep.requestBody = val;
      refreshLiveCurlBox(item);
    }

    function refreshLiveCurlBox(item) {
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      const allHeaders = [
        ...(item.globalHeaders || []).map(h => ({ ...h, isGlobal: true })),
        ...(ep.customHeaders || []).map(h => ({ ...h, isGlobal: false }))
      ];
      const compiled = compileLiveCurl(item, ep, allHeaders);
      const box = document.getElementById('live-curl-box');
      if (box) box.textContent = compiled;
    }

    function formatRequestBody() {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      if (!ep.requestBody || !ep.requestBody.trim()) {
        showToast("当前请求无 Body 内容");
        return;
      }
      try {
        ep.requestBody = JSON.stringify(JSON.parse(ep.requestBody), null, 2);
        const bodyInput = document.getElementById('endpoint-body-input');
        if (bodyInput) bodyInput.value = ep.requestBody;
        refreshLiveCurlBox(item);
        showToast("JSON 格式化成功");
      } catch (e) {
        showToast("JSON 语法解析失败，请检查格式");
      }
    }

    function addNewQueryParam() {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      if (!ep.queryParams) ep.queryParams = [];
      ep.queryParams.push({
        key: "newParam",
        value: "sampleValue",
        enabled: true,
        desc: "自定义 Query 参数"
      });
      renderCredentialCanvas(item);
      showToast("已追加 Query 参数");
    }

    function addNewCustomHeader() {
      const item = STORE.credential.find(x => x.id === currentSelectedId);
      const ep = item.swaggerEndpoints[item.selectedEndpointIndex || 0];
      if (!ep.customHeaders) ep.customHeaders = [];
      ep.customHeaders.push({
        key: "X-Custom-Trace-Tag",
        value: "debug_session_2026",
        enabled: true,
        desc: "动态临时 Header"
      });
      renderCredentialCanvas(item);
      showToast("已追加接口专属 Header 参数");
    }

    function sendLiveProbe() {
      showToast("探针请求已发送...");
      setTimeout(() => {
        probeResponseMock = JSON.stringify({
          code: 0,
          message: "SUCCESS",
          traceId: "trace_99182a001928_prod",
          data: {
            orderId: "ord_20260908_88912",
            status: "CREATED",
            payAmount: 398.00,
            createdAt: "2026-09-09T18:32:00Z"
          }
        }, null, 2);
        const item = STORE.credential.find(x => x.id === currentSelectedId);
        renderCredentialCanvas(item);
      }, 300);
    }

    // 全局 Headers Tab
    function renderGlobalHeadersTab(item) {
      const gHeaders = item.globalHeaders || [];
      return `
        <div class="space-y-4">
          <div class="p-3.5 rounded-lg bg-black/[0.02] border border-black/10 flex items-center justify-between">
            <div>
              <h4 class="font-bold text-black/80 text-xs">全局服务默认请求头 (Service-Level Shared Headers)</h4>
              <p class="text-[11px] text-black/60 mt-0.5">在此配置的 Header 会自动穿透继承给所有接口，避免每个接口重复填写。</p>
            </div>
            <button onclick="showToast('支持新增全局头')" class="px-3 py-1 rounded bg-[#007AFF] shadow-[0_2px_8px_rgba(0,122,255,0.3)] text-white text-xs font-medium">+ 新增全局头</button>
          </div>

          <div class="bg-black/[0.05] border border-black/10 rounded-xl overflow-hidden divide-y divide-black/5 text-xs">
            ${gHeaders.map(h => `
              <div class="p-3 flex items-center justify-between">
                <div>
                  <span class="mono font-bold text-black/80">${h.key}</span>
                  <span class="mono text-emerald-400 ml-2">${h.value}</span>
                </div>
                <span class="text-[11px] text-black/60">${h.desc}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // 附件 Tab
    function renderAttachmentsTab(item) {
      const atts = item.attachments || [];
      return `
        <div class="space-y-3">
          <div class="p-3 rounded-lg bg-black/[0.02] border border-black/10 flex items-center justify-between">
            <span class="text-xs text-black/70 font-medium">关联本地离线白皮书与 Postman 导包</span>
            <button onclick="showToast('上传附件')" class="px-2.5 py-1 rounded bg-[#007AFF] shadow-[0_2px_8px_rgba(0,122,255,0.3)] text-white text-xs">+ 挂载附件</button>
          </div>
          <div class="space-y-2">
            ${atts.map(a => `
              <div class="p-3 rounded-lg bg-black/[0.05] border border-black/10 flex items-center justify-between">
                <div>
                  <span class="font-semibold text-black/80 text-xs">${a.name}</span>
                  <span class="text-[10px] text-black/60 font-mono ml-2">(${a.size})</span>
                  <p class="text-[11px] text-black/50 mt-0.5">${a.memo}</p>
                </div>
                <button onclick="showToast('已在本地打开: ' + '${a.name}')" class="px-2.5 py-1 rounded bg-black/[0.05] shadow-sm border border-black/10 text-xs text-black/80">打开</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderEmptyCanvas() {
      const mount = document.getElementById('canvas-mount');
      mount.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center text-center p-8 text-black/50 space-y-2">
          <div class="text-3xl">📂</div>
          <p class="text-xs">暂无选中的项目或条目</p>
        </div>
      `;
    }

    // 辅助交互与筛选函数
    function filterCredByProject(projId) {
      activeCredProject = projId;
      renderLeftDimensionTree();
      const list = getFilteredItems();
      if (list[0]) selectItem(list[0].id);
      else renderMiddleList();
    }

    function setCredFamilyFilter(fam) {
      activeCredFamily = fam;
      renderSecondaryFilterBar();
      const list = getFilteredItems();
      if (list[0]) selectItem(list[0].id);
      else renderMiddleList();
    }

    function setKnowledgePlatformFilter(plat) {
      activeKnowledgePlatform = plat;
      renderLeftDimensionTree();
      renderSecondaryFilterBar();
      const list = getFilteredItems();
      if (list[0]) selectItem(list[0].id);
      else renderMiddleList();
    }

    function setRepoLanguageFilter(lang) {
      activeRepoLanguage = lang;
      renderLeftDimensionTree();
      renderSecondaryFilterBar();
      const list = getFilteredItems();
      if (list[0]) selectItem(list[0].id);
      else renderMiddleList();
    }

    function onSearchInput(e) {
      renderMiddleList(e.target.value);
    }

    function focusSearch() {
      document.getElementById('keyword-search-input').focus();
    }

    function toggleCardPassword(id) {
      const inp = document.getElementById('field-pwd-' + id);
      if (!inp) return;
      inp.type = inp.type === 'password' ? 'text' : 'password';
      showToast(inp.type === 'text' ? '密码明文已显示' : '密码已隐藏');
    }

    function copyToolboxCommand(id) {
      const item = STORE.credential.find(x => x.id === id);
      if (!item) return;
      let cmd = "";
      if (item.typeKey === 'mysql') cmd = `mysql -h ${item.fields.host} -P ${item.fields.port} -u ${item.fields.username} -p${item.fields.password} ${item.fields.database}`;
      else if (item.typeKey === 'redis') cmd = `redis-cli -h ${item.fields.host} -p ${item.fields.port} -a "${item.fields.authPassword}"`;
      else cmd = `curl -s "${item.fields.baseUrl}"`;
      copyToClipboard(cmd);
    }

    function toggleLockVault() {
      isVaultLocked = !isVaultLocked;
      const dot = document.getElementById('lock-dot');
      const txt = document.getElementById('lock-txt');
      if (isVaultLocked) {
        dot.className = "w-1.5 h-1.5 rounded-full bg-rose-500";
        txt.textContent = "已锁定";
        showToast("本地金库已闭锁 (内存密文已擦除)");
      } else {
        dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500";
        txt.textContent = "金库已解密";
        showToast("本地金库已解密 (AES-256-GCM)");
      }
    }

    function copyToClipboard(txt) {
      navigator.clipboard.writeText(txt);
      showToast("已复制到系统剪贴板 (30秒后自动清除)");
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      t.classList.remove('opacity-0', 'translate-y-2');
      t.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        t.classList.remove('opacity-100', 'translate-y-0');
        t.classList.add('opacity-0', 'translate-y-2');
      }, 2500);
    }

    function openIngestModal() {
      document.getElementById('ingest-modal').classList.remove('hidden');
    }

    function closeIngestModal() {
      document.getElementById('ingest-modal').classList.add('hidden');
    }

    function presetIngest(type) {
      const inp = document.getElementById('ingest-url-input');
      if (type === 'wechat') inp.value = "https://mp.weixin.qq.com/s/sample_high_concurrency_architecture";
      else if (type === 'github') inp.value = "https://github.com/hyperium/tonic";
      else inp.value = "https://api.mall.internal.net/v3/api-docs";
    }

    function startIngestPipeline() {
      const url = document.getElementById('ingest-url-input').value.trim();
      if (!url) {
        showToast("请输入有效 URL");
        return;
      }
      closeIngestModal();
      showToast("抓取分析管线启动中...");

      setTimeout(() => {
        if (url.includes('github.com')) {
          STORE.repo.push({
            id: "repo-" + Date.now(),
            name: "hyperium/tonic",
            owner: "hyperium",
            repoName: "tonic",
            language: "Rust",
            langColor: "#dea584",
            stars: "8.9k",
            forks: "720",
            watchers: "95",
            license: "MIT",
            latestRelease: "v0.11.0",
            releaseDate: "2026-09-02",
            localWorkspacePath: "d:/develop/coding/rust/tonic-demo",
            summary: "A native gRPC over HTTP/2 implementation focused on high performance and interoperability.",
            releaseNotes: "### v0.11.0\n- HTTP/2 stream multiplexing optimization.\n- Protoc code generator improvements.",
            cookbookNotes: "# Tonic gRPC 备忘\n使用 tower 中间件处理认证与限流。"
          });
          updateCounts();
          switchPillar('repo', STORE.repo[STORE.repo.length - 1].id);
          showToast("GitHub 仓库已成功收录！");
        } else {
          STORE.knowledge.push({
            id: "know-" + Date.now(),
            platform: "wechat",
            platformName: "微信公众号",
            sourceName: "阿里技术",
            author: "高可用架构专家",
            title: "微服务高并发治理：熔断、降级与流量整形最佳实战",
            date: "2026-09-09",
            url: url,
            imagesCount: 4,
            tags: ["微服务", "高可用", "Sentinel"],
            readerMode: "flow",
            summary: "微信公众号离线快送：系统过载自适应保护算法，滑动窗口限流实现细节。",
            content: "### 离线内容\n自适应限流根据 CPU 使用率动态调整入口流量。"
          });
          updateCounts();
          switchPillar('knowledge', STORE.knowledge[STORE.knowledge.length - 1].id);
          showToast("微信文章已完整离线抓取并转存图片！");
        }
      }, 600);
    }

    function openAddModal() {
      showToast("新建凭据/条目对话框已就绪");
    }

    window.onload = init;
  </script>
</div></body>
</html>
