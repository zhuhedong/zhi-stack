# Build the Tauri desktop client (src-tauri/) for macOS, Windows and Linux.
#   push to main       -> if tag v<version> does not exist yet: build all platforms and
#                         publish release v<version> (draft during the build, published
#                         only after every platform succeeded). No version bump -> skip.
#   push tag v*        -> same, for that tag (tag must equal v<version>)
#   workflow_dispatch  -> build all platforms and upload workflow artifacts; with
#                         release=true also publish a release (optionally a test prerelease)
#   pull_request       -> cheap Linux-only compile check when desktop code changes
# Tags created here by GITHUB_TOKEN do not trigger new workflow runs, so a main push
# never causes a second tag-triggered run. Signing is optional; see docs/desktop-release.md.
name: Desktop release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Also create and publish a GitHub Release'
        type: boolean
        default: false
      tag:
        description: 'Release tag override (test prereleases only, must contain "-", e.g. v0.0.0-ci-test)'
        type: string
        default: ''
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write

# A main push and a tag push of the same commit (same version) run one after the
# other; the second one sees the published release and skips.
concurrency:
  group: desktop-release-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: package.json / Cargo.toml / tauri.conf.json must agree
        run: |
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$pkg tauri.conf.json=$conf src-tauri/Cargo.toml=$cargo"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::Version mismatch: package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Decide what to build and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="v$VERSION"; build=true; release=false; prerelease=false
          case "$EVENT" in
            pull_request) build=false ;;
            push)
              release=true
              if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
                echo "::error::Tag $GITHUB_REF_NAME does not match version $tag"; exit 1
              fi ;;
            workflow_dispatch)
              if [ "$INPUT_RELEASE" = true ]; then
                release=true
                if [ -n "$INPUT_TAG" ]; then
                  if [[ "$INPUT_TAG" != v*-* ]]; then
                    echo "::error::Tag override is for test prereleases and must look like v0.0.0-ci-test"; exit 1
                  fi
                  tag=$INPUT_TAG
                fi
              fi ;;
          esac
          [[ "$tag" == *-* ]] && prerelease=true
          if [ "$release" = true ]; then
            # Already published -> nothing to do (cheap skip for pushes without a version bump).
            draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
            if [ "$draft" = false ]; then
              echo "Release $tag is already published; skipping."; build=false; release=false
            elif [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && [ "$draft" = none ] \
                 && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists without a release; skipping."; build=false; release=false
            fi
          fi
          echo "tag=$tag build=$build release=$release prerelease=$prerelease"
          { echo "tag=$tag"; echo "build=$build"; echo "release=$release"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

  prepare:
    name: Create draft release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Reusing draft $TAG from a previous failed run; removing old assets."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              while read -r a; do gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" -y; done
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          else
            flags=(--draft --generate-notes --target "$GITHUB_SHA" --title "InfoHub $TAG")
            [ "$PRE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          fi
          id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)
          [ -n "$id" ] || { echo "::error::release id not found"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  pr-check:
    name: Linux compile check (PR)
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri -- build --no-bundle

  build:
    name: Build ${{ matrix.name }}
    needs: [version, prepare]
    if: >-
      !cancelled() && needs.version.outputs.build == 'true' &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS x64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Export signing variables only when the secrets exist, so forks and
      # unconfigured repos still produce unsigned builds.
      - name: Optional signing configuration
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          put() {
            local name=$1
            local value=${!name}
            [ -n "$value" ] || return 0
            local eof
            eof="EOF_$(openssl rand -hex 8)"
            { echo "$name<<$eof"; echo "$value"; echo "$eof"; } >> "$GITHUB_ENV"
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ]; then
              put APPLE_CERTIFICATE; put APPLE_CERTIFICATE_PASSWORD; put APPLE_SIGNING_IDENTITY
              echo "macOS code signing: enabled"
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                put APPLE_ID; put APPLE_PASSWORD; put APPLE_TEAM_ID
                echo "macOS notarization: enabled"
              fi
            else
              echo "macOS code signing: not configured (unsigned build)"
            fi
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            put TAURI_SIGNING_PRIVATE_KEY; put TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            echo "Tauri updater signing key: present"
          fi

      - name: Build and upload to the draft release
        if: needs.version.outputs.release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.id }}
          args: ${{ matrix.args }}

      - name: Build
        if: needs.version.outputs.release != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: infohub-${{ needs.version.outputs.version }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/**/release/bundle/msi/*.msi*
            src-tauri/target/**/release/bundle/nsis/*.exe*
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage*

  publish:
    name: Publish release
    needs: [version, prepare, build]
    if: needs.version.outputs.release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Upload version-less copies for /download (releases/latest/download/<name>)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p stable && cd stable
          copy() { # <glob> <stable name>
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$1" --clobber
            f=$(ls $1 | head -n1); mv "$f" "$2"
          }
          copy '*_aarch64.dmg'      InfoHub_macos_aarch64.dmg
          copy '*_x64.dmg'          InfoHub_macos_x64.dmg
          copy '*_x64-setup.exe'    InfoHub_windows_x64-setup.exe
          copy '*_x64_en-US.msi'    InfoHub_windows_x64.msi
          copy '*_amd64.deb'        InfoHub_linux_amd64.deb
          copy '*_amd64.AppImage'   InfoHub_linux_amd64.AppImage
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber InfoHub_*
      - name: Flip draft to published (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRE: ${{ needs.version.outputs.prerelease }}
        run: |
          latest=true; [ "$PRE" = true ] && latest=false
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets \
            -q '"\(.url) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
