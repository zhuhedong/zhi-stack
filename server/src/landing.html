<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>InfoHub</title>
<style>
:root{color-scheme:light;--bg:#f5f5f7;--card:rgba(255,255,255,.72);--text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 20% 0%,#e8f0fe 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#fdeff4 0%,transparent 55%),var(--bg)}
main{max-width:560px;width:100%;padding:40px 36px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.08);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
h1{margin:0 0 8px;font-size:34px;letter-spacing:-.02em}
p{margin:0 0 16px;line-height:1.6;color:var(--muted)}
ul{margin:0 0 24px;padding-left:20px;color:var(--text);line-height:1.8}
.btn{display:inline-block;padding:12px 22px;border-radius:980px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
.btn.disabled{background:#d2d2d7;color:#6e6e73;cursor:default}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px}
</style>
</head>
<body>
<main>
<h1>InfoHub</h1>
<p>私有的个人知识与资源工作台：收藏文章、GitHub 仓库、服务器凭证和 API 调试记录，内容在服务端加密保存。</p>
<ul>
<li>文章离线保存与 Markdown 阅读、批注</li>
<li>GitHub 仓库订阅与 Release 提醒</li>
<li>加密的凭证与 API 环境变量</li>
</ul>
<p>此服务器未开放网页版，请使用桌面客户端连接本服务地址。</p>
{{DOWNLOAD}}
<footer>InfoHub 服务端 v{{VERSION}} · API：<code>/api</code></footer>
</main>
</body>
</html>
